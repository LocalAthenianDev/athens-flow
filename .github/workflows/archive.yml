name: Αρχείο μετρήσεων

# Το API της Περιφέρειας δίνει μόνο την τελευταία μέτρηση κάθε σταθμού.
# Αυτή η ροή την αποθηκεύει κάθε λίγα λεπτά στον κλάδο `data`, ώστε να υπάρχει ανοιχτό ιστορικό.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/archive.mjs', 'lib/clean.js', 'lib/profiles.js', '.github/workflows/archive.yml']

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Κλάδος data
        run: |
          git fetch origin data --depth 1 2>/dev/null && git worktree add archive origin/data || {
            git worktree add --detach archive
            cd archive && git checkout --orphan data && git rm -rfq . && cd ..
          }
      - name: Στιγμιότυπο
        run: node scripts/archive.mjs archive
      - name: Αποθήκευση
        run: |
          cd archive
          git config user.name "athens-flow-bot"
          git config user.email "athens-flow-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "Μετρήσεις $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:data
